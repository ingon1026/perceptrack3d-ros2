# perceptrack3d_ros 노드 파라미터 기본값. 알고리즘 파라미터(fusion, tracking, detection) 는 configs/kitti.yaml 에 있다.
#
# 전부 와일드카드 `/**` 아래에 둔다 (노드별 섹션을 쓰지 않는 이유):
#   launch 에서 dict 로 넘기는 오버라이드(예: loop:=true) 를 launch_ros 가 `/**` 아래의 임시 yaml 로 쓰는데,
#   rcl 은 "정확한 노드 이름 섹션 > 와일드카드 섹션" 으로 우선순위를 매겨 launch 인자가 무시된다.
#   같은 `/**` 끼리는 나중 파일이 이기므로 launch 인자가 이 파일을 덮어쓸 수 있다.
#   각 노드는 자기가 declare 한 파라미터만 읽으므로 다른 노드의 키가 섞여 있어도 무시된다.

/**:
  ros__parameters:
    # --- 공통 ---
    rate_hz: 10.0                     # 재생 주기. stamp = frame_id / rate_hz 규약이라 모든 노드가 같은 값을 써야 한다
    sync_slop_s: 0.02                 # ApproximateTimeSynchronizer 허용 시각차 (s). 같은 프레임은 stamp 가 정확히 같으므로 여유값
    marker_lifetime_s: 0.15           # RViz 마커 수명 (s). 10 Hz 주기(0.1 s) 보다 약간 길게 → 깜빡임 없이 다음 프레임이 덮어씀

    # --- kitti_player_node ---
    loop: false
    start_frame: 0
    end_frame: -1                     # -1 = 마지막 프레임(296)
    start_delay_s: 5.0                # 첫 프레임 발행 전 대기 (detector 의 YOLO 로드·warm-up, fusion 의 open3d import 시간)

    # --- detector_node ---
    use_offline_json: false           # true 면 YOLO 대신 outputs/phase4/detections.json 재생 (CPU 부하 없음)
    offline_json_path: ""
    torch_threads: 4                  # torch 내부 스레드 수. 노드 6 개가 한 CPU 를 나눠 쓰므로 기본(코어 수 전부) 은 경합으로 오히려 느려진다

    # --- lidar_projection_node ---
    point_radius_px: 1

    # --- fusion_node ---
    method: clustered                 # raw | clustered

    # --- tracker_node ---
    trail_length: 30                  # LINE_STRIP 궤적 길이 (프레임)
